services:
  - type: web
    name: voice-rag-pipeline
    env: python
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MALLOC_TRIM_THRESHOLD_
        value: "65536"