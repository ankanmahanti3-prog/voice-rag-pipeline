services:
  - type: web
    name: voice-rag-pipeline
    env: python
    buildCommand: "pip install -r requirements.txt && pip install python-multipart uvicorn"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false