app:
  name: "Voice-RAG-Pipeline"
  target_latency_ms: 200

stt:
  provider: "sarvam"
  model: "saaras:v3"
  language_code: "hi-IN"

embeddings:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  dimension: 384

vectordb:
  index_path: "logs/faiss_index.bin"
  metadata_path: "logs/chunks_metadata.json"
  top_k: 3

llm:
  provider: "groq"
  model_name: "llama-3.1-8b-instant"
  temperature: 0.1
  max_tokens: 150

guardrails:
  similarity_threshold: 0.40
  refusal_message: "I do not have sufficient context from the provided dataset to answer this question accurately."